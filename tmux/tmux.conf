# ~/.tmux.conf
# tmux configuration

# プレフィックスキーを Ctrl-a に変更（Ctrl-b から）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 設定リロード（prefix + r）
unbind r
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# ウィンドウ・ペインの番号を 1 始まりにする
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウを閉じた際に番号を詰める
set -g renumber-windows on

# マウス操作を有効化
set -g mouse on

# 256色 + True Color 対応
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# エスケープの遅延をなくす（vim などの操作を快適にする）
set -sg escape-time 0

# 履歴のスクロールバック行数
set -g history-limit 10000

# ペインの分割（| で縦分割, - で横分割。カレントパスを維持）
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim風のキーバインドでペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim風のキーバインドでペインリサイズ（繰り返し可能）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# コピーモードを vi キーバインドに
setw -g mode-keys vi

# ステータスバーを上部に表示
set -g status-position top

# ステータスバーの見た目
set -g status-style "bg=colour235,fg=colour255"
set -g status-left "#[bg=colour4,fg=colour235] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=colour250]%Y-%m-%d(%a) %H:%M "
set -g status-right-length 40

# アクティブウィンドウの強調
setw -g window-status-current-style "bg=colour4,fg=colour235,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
